<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>prueba2</title>
</head>
<body>
    <script>
        fetch("yeison.json")
        .then(response => {
            if (response.ok)
            return response.text();

            throw new Error(response.status);
        })
        .then(data => {
            console.log("Datos: " + data);
        })
        .catch(err => {
            console.error("ERROR: ", err.message)
        });
    </script>
</body>
</html>
